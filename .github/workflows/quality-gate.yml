name: Unified Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['docs/**', 'runbooks/**', 'scripts/**', '.github/**', '**.vue', '**.ts']

permissions:
  contents: read
  pull-requests: read

jobs:
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    env:
      DIST_DIR: ${{ github.workspace }}/docs/.vitepress/dist
      BASE_URL: /

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------
      # 🔴 BLOCKERS (must pass)
      # ---------------------

      - name: 🔴 Markdown lint & links
        id: markdown_lint
        run: pnpm run lint:md

      - name: 🔴 Frontmatter schema
        id: frontmatter
        run: pnpm run frontmatter:lint

      - name: 🔴 Release folder structure
        id: release_folders
        run: pnpm run release:folders:check

      # New: build must succeed → L4 if not
      - name: 🔴 Build VitePress site
        id: build_docs
        run: pnpm run docs:build
        # typical script: "docs:build": "vitepress build docs"

      # New: crawl built site for broken links → L4 if internal links fail
      - name: 🔴 Check internal links (dist crawl)
        id: link_check_internal
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: >-
            --offline
            --root-dir "${{ env.DIST_DIR }}"
            --require-https
            --exclude-path '(^|/)drafts/.*'
            --exclude 'file://.*/[^./#]+(?:/[^./#]+)*$'
            --github-token "${{ secrets.GITHUB_TOKEN }}"
            "${{ env.DIST_DIR }}/**/*.html"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------
      # 🟡 WARNERS (non-blocking)
      # ---------------------

      - name: 🟡 Content guard (L2/L3 logs)
        id: content_guard
        run: pnpm run guard
        continue-on-error: true

      - name: 🟡 UX scan
        id: ux_scan
        run: pnpm run ux:scan
        continue-on-error: true

      - name: 🟡 Drift detection
        id: drift
        run: pnpm run drift
        continue-on-error: true

      - name: 🟡 Stale pages
        id: stale
        run: pnpm run stale
        continue-on-error: true

      - name: 🟡 Accessibility
        id: accessibility
        run: pnpm run test:components
        continue-on-error: true

      - name: 🟡 Unit tests
        id: unit_tests
        run: pnpm run test:unit
        continue-on-error: true

      # Optional: external link check as advisory (keeps flakes out)
      - name: 🟡 Check external links (advisory)
        id: link_check_external
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --github-token "${{ secrets.GITHUB_TOKEN }}"
            --retry-wait-secs 5
            --max-retries 4
            --accept 200,403,429
            --exclude "https://localhost/*"
            --exclude "https://github.com/lop-louis/northbook/issues/new.*"
            --exclude "https://github.com/lop-louis/northbook/edit/.*"
            "${{ env.DIST_DIR }}/**/*.html"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------
      # 📦 Preview artifact (optional but handy)
      # ---------------------
      - name: Upload preview artifact
        if: always() && steps.build_docs.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: preview-dist
          path: ${{ env.DIST_DIR }}
          retention-days: 7

      # ---------------------
      # 🧾 SUMMARY REPORT
      # ---------------------
      - name: Generate summary
        if: always()
        run: |
          echo "# Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔴 Critical (Must Pass)" >> $GITHUB_STEP_SUMMARY
          echo "✅ markdown lint" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.markdown_lint.outcome }}" != "success" ] && echo "❌ **markdown lint failed**" >> $GITHUB_STEP_SUMMARY || echo "✅ markdown lint" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.frontmatter.outcome }}" != "success" ] && echo "❌ **frontmatter failed**" >> $GITHUB_STEP_SUMMARY || echo "✅ frontmatter" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.release_folders.outcome }}" != "success" ] && echo "❌ **release folders failed**" >> $GITHUB_STEP_SUMMARY || echo "✅ release folders" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.build_docs.outcome }}" != "success" ] && echo "❌ **build docs failed**" >> $GITHUB_STEP_SUMMARY || echo "✅ build docs" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.link_check_internal.outcome }}" != "success" ] && echo "❌ **link check internal failed**" >> $GITHUB_STEP_SUMMARY || echo "✅ link check internal" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🟡 Advisory (Non-Blocking)" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.content_guard.outcome }}" = "success" ] && echo "✅ content guard" >> $GITHUB_STEP_SUMMARY || echo "⚠️ content guard – review warnings" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.ux_scan.outcome }}" = "success" ] && echo "✅ ux scan" >> $GITHUB_STEP_SUMMARY || echo "⚠️ ux scan – review warnings" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.drift.outcome }}" = "success" ] && echo "✅ drift" >> $GITHUB_STEP_SUMMARY || echo "⚠️ drift – review warnings" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.stale.outcome }}" = "success" ] && echo "✅ stale" >> $GITHUB_STEP_SUMMARY || echo "⚠️ stale – review warnings" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.accessibility.outcome }}" = "success" ] && echo "✅ accessibility" >> $GITHUB_STEP_SUMMARY || echo "⚠️ accessibility – review warnings" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.unit_tests.outcome }}" = "success" ] && echo "✅ unit tests" >> $GITHUB_STEP_SUMMARY || echo "⚠️ unit tests – review warnings" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.link_check_external.outcome }}" = "success" ] && echo "✅ link check external" >> $GITHUB_STEP_SUMMARY || echo "⚠️ link check external – review warnings" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.markdown_lint.outcome }}" = "success" ] \
             && [ "${{ steps.frontmatter.outcome }}" = "success" ] \
             && [ "${{ steps.release_folders.outcome }}" = "success" ] \
             && [ "${{ steps.build_docs.outcome }}" = "success" ] \
             && [ "${{ steps.link_check_internal.outcome }}" = "success" ]; then
            echo "✨ **All critical checks passed** – ready to merge" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚫 **Critical checks failed** – fix blockers above before merging" >> $GITHUB_STEP_SUMMARY
          fi
